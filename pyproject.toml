[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unischema"
version = "1.0.0"
description = "Universal Data Validation & Quality Analysis Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "UniSchema Contributors"}
]
keywords = [
    "data-validation",
    "pydantic",
    "data-quality",
    "csv",
    "excel",
    "json",
    "pdf",
    "pandas",
    "schema",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
pdf = ["tabula-py>=2.7.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
all = ["unischema[pdf,dev]"]

[project.scripts]
unischema = "unischema.cli:main"

[project.urls]
Homepage = "https://github.com/vyassoham/SchemaGuard"
Documentation = "https://github.com/vyassoham/SchemaGuard#readme"
Repository = "https://github.com/vyassoham/SchemaGuard.git"
Issues = "https://github.com/vyassoham/SchemaGuard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["unischema*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
